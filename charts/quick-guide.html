<title>ATOM Quick Guide · 16 页版式稿</title>
<style>
  /* ============ 画布（查看器）============ */
  :root{
    --canvas:#ece9e4; --canvas-ink:#2a2825; --canvas-mut:#8a857d;
    --chip:#ffffff; --chip-bd:#d8d3cb; --accent:#5E8A00;
  }
  @media (prefers-color-scheme: dark){
    :root{ --canvas:#191a1c; --canvas-ink:#e8e6e1; --canvas-mut:#8b8d90; --chip:#232527; --chip-bd:#3a3d40; }
  }
  :root[data-theme="dark"]{ --canvas:#191a1c; --canvas-ink:#e8e6e1; --canvas-mut:#8b8d90; --chip:#232527; --chip-bd:#3a3d40; }
  :root[data-theme="light"]{ --canvas:#ece9e4; --canvas-ink:#2a2825; --canvas-mut:#8a857d; --chip:#ffffff; --chip-bd:#d8d3cb; }

  body{ background:var(--canvas); color:var(--canvas-ink);
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    margin:0; padding:0 0 64px; }
  .chrome{ position:sticky; top:0; z-index:9; background:var(--canvas);
    border-bottom:1px solid var(--chip-bd); padding:14px 22px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .chrome h1{ font-size:15px; margin:0; font-weight:700; letter-spacing:.01em; }
  .spec{ font-size:11px; color:var(--canvas-mut); letter-spacing:.04em; }
  .spacer{ flex:1; }
  .seg{ display:flex; border:1px solid var(--chip-bd); background:var(--chip); }
  .seg button{ font:inherit; font-size:12px; padding:5px 14px; border:0; background:transparent;
    color:var(--canvas-mut); cursor:pointer; }
  .seg button[aria-pressed="true"]{ background:var(--canvas-ink); color:var(--canvas); }
  .seg button:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
  .btn{ font:inherit; font-size:12px; padding:5px 14px; border:1px solid var(--chip-bd);
    background:var(--chip); color:var(--canvas-ink); cursor:pointer; }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }

  main{ max-width:1560px; margin:0 auto; padding:30px 22px; }
  .hint{ font-size:12px; color:var(--canvas-mut); margin:0 0 26px; max-width:70ch; line-height:1.6; }
  .book{ display:flex; flex-wrap:wrap; gap:34px 26px; align-items:flex-start; }
  .group{ display:flex; flex-direction:column; gap:8px; }
  .group .pair{ display:flex; gap:0; box-shadow:0 12px 34px rgba(0,0,0,.18); }
  .group .pair .card + .card{ border-left:1px dashed #c9c9c9; }
  .glabel{ font-size:11px; color:var(--canvas-mut); letter-spacing:.06em; }

  /* ============ 卡片（成品页，恒白）============ */
  .card{ --l:26px; --m:14px; --s:10.5px; --ink:#141414; --mut:#7d7d7d; --fill:#ededed;
    width:320px; height:508px; background:#fff; color:var(--ink);
    box-sizing:border-box; padding:24px 22px 18px; position:relative;
    display:flex; flex-direction:column; flex:none; cursor:zoom-in; }
  .card *{ box-sizing:border-box; }
  .card .eyebrow{ font-size:var(--s); letter-spacing:.14em; color:var(--mut);
    text-transform:uppercase; margin:0 0 6px; min-height:12px; }
  .card h2{ font-size:var(--l); line-height:1.08; margin:0 0 10px; font-weight:700;
    letter-spacing:-.01em; text-wrap:balance; }
  .card .bar{ width:44px; height:5px; background:var(--ink); margin-bottom:14px; }
  .card .cbody{ flex:1; display:flex; flex-direction:column; min-height:0; }
  .card .cfoot{ display:flex; justify-content:space-between; font-size:var(--s);
    color:var(--mut); padding-top:10px; }
  .card .m{ font-size:var(--m); line-height:1.35; }
  .card .s{ font-size:var(--s); line-height:1.45; color:var(--mut); }
  .card .note{ font-size:var(--s); line-height:1.45; color:var(--mut);
    border-top:1px solid #e2e2e2; padding-top:8px; }
  .card .badge{ display:inline-block; font-size:var(--s); font-weight:700; letter-spacing:.05em;
    background:var(--ink); color:#fff; padding:3px 8px; }
  .card .stepn{ display:inline-block; border:2px solid var(--ink); border-radius:999px;
    font-size:var(--m); font-weight:800; padding:1px 9px; margin-right:8px; vertical-align:4px; }
  /* 双语模式：副语言灰字同字号堆叠（不新增字号档） */
  .card .bi{ display:block; color:var(--mut); font-weight:400; }
  .card h2 .bi{ font-size:var(--m); font-weight:600; letter-spacing:0; margin-top:3px; }
  .card .cover-title .bi{ font-size:var(--m); font-weight:700; letter-spacing:.14em; margin-top:8px; }
  .card b .bi{ font-weight:400; }
  .card .badge .bi{ color:#d6d6d6; }
  .card svg text{ font-family:inherit; fill:var(--ink); }
  .card svg .txt-s{ font-size:10.5px; }
  .card svg .txt-m{ font-size:14px; }
  .card svg .mut{ fill:var(--mut); }

  /* 封面 */
  .card.cover{ justify-content:space-between; padding-top:44px; }
  .card.cover h2{ font-size:var(--l); }
  .card.cover .cover-title{ font-size:32px; font-weight:800; letter-spacing:-.02em; margin:0; }
  /* 封面标题是全册唯一例外档（仅封面页使用，仍满足"每页 ≤3 档"） */
  .card.cover .wordmark{ font-weight:800; letter-spacing:.32em; font-size:var(--m); }

  /* 灯箱 */
  .lightbox{ position:fixed; inset:0; z-index:99; background:rgba(20,20,20,.72);
    display:none; align-items:center; justify-content:center; cursor:zoom-out; }
  .lightbox.open{ display:flex; }
  .lightbox .holder{ transform:scale(1.5); box-shadow:0 30px 80px rgba(0,0,0,.5); }
  @media (prefers-reduced-motion:no-preference){
    .lightbox .holder{ transition:transform .15s ease; }
  }

  /* ============ 打印：54 × 85.6 mm 每页 ============ */
  @page{ size:54mm 85.6mm; margin:0; }
  @media print{
    body{ background:#fff; padding:0; }
    .chrome,.hint,.glabel,.lightbox{ display:none !important; }
    main{ padding:0; max-width:none; }
    .book,.group{ display:block; }
    .group .pair{ display:block; box-shadow:none; }
    .group .pair .card + .card{ border-left:0; }
    .printbox{ width:54mm; height:85.6mm; overflow:hidden; page-break-after:always; }
    .card{ transform:scale(.6378); transform-origin:0 0; cursor:default; }
  }

  /* ============ 单页导出模式（?page=N&lang=xx）============ */
  body.export{ background:#fff; padding:0; }
  body.export .chrome, body.export .hint, body.export .glabel, body.export .lightbox{ display:none; }
  body.export main{ padding:0; max-width:none; }
  body.export .book, body.export .group{ display:block; }
  body.export .group .pair{ display:block; box-shadow:none; }
  body.export .group .pair .card + .card{ border-left:0; }
  /* 导出走高 device-scale-factor 截图（CSS zoom/transform 缩放在无头 Chromium 下有丢画 bug） */
  body.export .card{ cursor:default; }
  body.export .card[data-hidden="1"]{ display:none; }
  body.export .printbox:not(:has(.card:not([data-hidden]))){ display:none; }
</style>

<div class="chrome">
  <h1>ATOM Quick Guide · 排版稿</h1>
  <span class="spec">16 面 = 8 张正反面 · 单面 54 × 85.6 mm（信用卡）· 每页 ≤ 3 字号</span>
  <span class="spacer"></span>
  <div class="seg" role="group" aria-label="Language">
    <button id="lang-en" aria-pressed="true" onclick="setLang('en')">EN</button>
    <button id="lang-zh" aria-pressed="false" onclick="setLang('zh')">中文</button>
  </div>
  <button class="btn" onclick="window.print()">打印 / PDF</button>
</div>

<main>
  <p class="hint">默认<b>中文版</b>，中 / 英分开两套物料，各自单语交付。
  按小册子对页排列（虚线 = 骑马钉中缝），点击任意页放大，「打印 / PDF」按 54 × 85.6 mm 逐页出 16 面。
  二维码为真实链接可扫码验证。界面示意均为抽象图（不绑定具体 UI），插图线稿终稿由设计师 3D 渲染图替换。</p>
  <div class="book" id="book"></div>
</main>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')"><div class="holder" id="lb-holder"></div></div>

function T(lang){
  const bi = lang === "bi", en1 = lang === "en" || bi;
  const f = bi
    ? (en, zh) => en === zh ? en : `${en}<span class="bi">${zh}</span>`

  f.one = (en, zh) => en1 ? en : zh;
  f.inline = (en, zh) => bi ? `${en} · ${zh}` : (en1 ? en : zh);
  f.sv = (en, zh) => bi ? (en === zh ? [en] : [en, zh]) : [en1 ? en : zh];
  return f;
}

}

/* ============ 渲染 ============ */
const qs = new URLSearchParams(location.search);
const EXPORT_PAGE = qs.get("page") ? parseInt(qs.get("page"), 10) : null;
let LANG = ["en", "zh", "bi"].includes(qs.get("lang")) ? qs.get("lang") : "zh";  /* 中文优先 */

function cardHtml(i, lang){
  const t = T(lang), n = i + 1;
  const inner = PAGES[i](t) + (i === 0 ? "" : foot(t, n));
  return `<div class="card${i === 0 ? " cover" : ""}" data-p="${n}" onclick="openLb(${i})"
    role="img" aria-label="Page ${n}">${inner}</div>`;
}

function render(){
  const book = document.getElementById("book");
  const groups = [];
  const glabel = (s) => `<div class="glabel">${s}</div>`;
  const wrap = (cards) => `<div class="pair">${cards}</div>`;
  groups.push(`<div class="group">${glabel("封面 01")}${wrap(`<div class="printbox">${cardHtml(0, LANG)}</div>`)}</div>`);
  for (let p = 1; p < 15; p += 2){
    groups.push(`<div class="group">${glabel(`对页 ${String(p + 1).padStart(2, "0")}–${String(p + 2).padStart(2, "0")}`)}
      ${wrap(`<div class="printbox">${cardHtml(p, LANG)}</div><div class="printbox">${cardHtml(p + 1, LANG)}</div>`)}</div>`);
  }
  groups.push(`<div class="group">${glabel("封底 16")}${wrap(`<div class="printbox">${cardHtml(15, LANG)}</div>`)}</div>`);
  book.innerHTML = groups.join("");
  for (const l of ["en", "zh"])
    document.getElementById("lang-" + l).setAttribute("aria-pressed", LANG === l);
  if (EXPORT_PAGE){
    document.body.classList.add("export");
    document.querySelectorAll(".card").forEach(c => {
      if (parseInt(c.dataset.p, 10) !== EXPORT_PAGE) c.setAttribute("data-hidden", "1");
    });
  }
}
function setLang(l){ LANG = l; render(); }
function openLb(i){
  if (document.body.classList.contains("export")) return;
  const h = document.getElementById("lb-holder");
  h.innerHTML = cardHtml(i, LANG).replace(/onclick="[^"]*"/, "");
  document.getElementById("lightbox").classList.add("open");
}
render();
</script>
